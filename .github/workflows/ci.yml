name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
        # Sem Postgres/Redis neste runner -- os testes de integração
        # (test_persistence.py, test_cache.py) detectam isso e são pulados
        # automaticamente (ver `requer_postgres`/`requer_redis`), em vez de
        # quebrar o CI. Os testes rápidos (schemas, agentes, orquestração,
        # API, observabilidade) sempre rodam.

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t credit-forge:${{ github.sha }} .
